    <meta name="description" content="Modern, professional admin dashboard for SIP CAFE. Manage orders, menu, customers, offers, services, sales analytics, and cafe settings." />

    <meta property="og:description" content="Modern, professional admin dashboard for SIP CAFE. Manage orders, menu, customers, offers, services, sales analytics, and cafe settings." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1200&q=80" />

    <!-- Twitter -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23C89D5C'><path d='M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z'/><line x1='6' y1='1' x2='6' y2='4'/><line x1='10' y1='1' x2='10' y2='4'/><line x1='14' y1='1' x2='14' y2='4'/></svg>" />

    <!-- Google Fonts: Playfair Display + Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- GitHub Pages relative asset & trailing slash resolver -->
    <script>
      (function() {
        var p = window.location.pathname;
        if (p && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body class="bg-[#FAF7F2] text-[#1C1917] antialiased selection:bg-[#C89D5C]/30 selection:text-[#2A1810]">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
